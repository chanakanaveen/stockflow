name: StockFlow checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: stockflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: stockflow_test
          MYSQL_USER: stockflow_test
          # Disposable credentials for this isolated CI service only.
          MYSQL_PASSWORD: ci-test-only-password
          MYSQL_ROOT_PASSWORD: ci-root-only-password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea
        with:
          php-version: '8.3'
          extensions: bcmath, pdo_mysql, mbstring, xml, curl, zip
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Backend dependencies and environment
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.testing.example .env.testing
          printf '\nDB_PASSWORD=ci-test-only-password\n' >> .env.testing
          php artisan key:generate --env=testing
          composer validate --strict
          composer audit
      - name: Backend verification on MySQL
        working-directory: backend
        run: |
          php vendor/bin/pint --test
          php vendor/bin/phpstan analyse --no-progress --memory-limit=512M
          php artisan test
      - name: Frontend verification
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm run test -- --run
          npm run build
          npm audit --omit=dev --audit-level=high
      - name: Browser acceptance and reconciliation
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
          cd ../backend
          php artisan inventory:reconcile --env=testing
      - name: API contract consistency
        run: node scripts/verify-openapi.mjs
