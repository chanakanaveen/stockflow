name: stockflow
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: stockflow
      MYSQL_USER: stockflow
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_TEST_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u stockflow -e 'SELECT 1' stockflow"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    environment:
      APP_NAME: StockFlow
      APP_ENV: local
      APP_DEBUG: "false"
      APP_KEY: ${APP_KEY:?Set APP_KEY in .env}
      APP_URL: http://localhost:${APP_PORT:-8080}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: stockflow
      DB_USERNAME: stockflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TEST_DB_PASSWORD: ${MYSQL_TEST_PASSWORD:?Set MYSQL_TEST_PASSWORD in .env}
      SESSION_DRIVER: database
      SESSION_ENCRYPT: "true"
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      DEMO_ENABLED: ${DEMO_ENABLED:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    depends_on:
      mysql:
        condition: service_healthy
  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
  web:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    volumes:
      - ./backend/public:/var/www/html/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
volumes:
  mysql-data:
